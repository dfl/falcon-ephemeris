<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meridian Clock — Falcon Ephemeris</title>
</head>
<body>
<!-- BEGIN ARTIFACT BODY -->
<style>
  :root {
    --bg: #0b0e14; --panel: #10141d; --ink: #e7e3d8; --muted: #8792a6;
    --line: #2a313f; --line-soft: #1b212c;
    --brass: #d4a94a; --cool: #79aec6; --violet: #9d8ec9;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f3efe4; --panel: #fbf9f3; --ink: #22252c; --muted: #6b7280;
      --line: #d8d0bf; --line-soft: #e7e1d3;
      --brass: #a5791f; --cool: #2f6f8c; --violet: #6b5aa0;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0b0e14; --panel: #10141d; --ink: #e7e3d8; --muted: #8792a6;
    --line: #2a313f; --line-soft: #1b212c;
    --brass: #d4a94a; --cool: #79aec6; --violet: #9d8ec9;
  }
  :root[data-theme="light"] {
    --bg: #f3efe4; --panel: #fbf9f3; --ink: #22252c; --muted: #6b7280;
    --line: #d8d0bf; --line-soft: #e7e1d3;
    --brass: #a5791f; --cool: #2f6f8c; --violet: #6b5aa0;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 1.1rem; padding: clamp(.75rem, 3vw, 2rem);
  }
  .eyebrow {
    font-size: 1.05rem; letter-spacing: .01em; color: var(--ink); font-weight: 600; text-align: center;
  }
  .eyebrow span { color: var(--muted); font-weight: 400; }

  .stage { display: flex; gap: clamp(1rem, 3vw, 2.4rem); align-items: center; justify-content: center; flex-wrap: wrap; width: 100%; }
  .dial-wrap { width: min(80vmin, 560px); aspect-ratio: 1; position: relative; }
  .mp-panel { width: min(230px, 84vw); align-self: flex-start; background: var(--panel);
              border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .mp-apex { display: flex; align-items: center; gap: .5rem; min-height: 2.3rem;
             padding: .5rem .6rem; border-bottom: 1px solid var(--line); }
  .mp-apex svg { width: 18px; height: 18px; }
  .mp-apex-deg { font-family: ui-monospace, "SF Mono", monospace; color: var(--ink);
                 font-variant-numeric: tabular-nums; letter-spacing: .02em; font-size: .92rem; }
  .mp-apex-sep { color: var(--muted); margin: 0 -.15rem; }
  .mp-apex.free { color: var(--muted); font-family: ui-monospace, monospace; font-size: .8rem; }
  .mp-scroll { max-height: min(64vmin, 470px); overflow-y: auto; }
  .mp-table { width: 100%; border-collapse: collapse; text-align: left;
              font-family: ui-monospace, "SF Mono", monospace; font-size: .8rem; }
  .mp-table thead th { position: sticky; top: 0; background: var(--panel); text-align: left;
                       font-size: .62rem; text-transform: uppercase; letter-spacing: .14em; color: var(--muted);
                       font-weight: 600; padding: .5rem .55rem; border-bottom: 1px solid var(--line); }
  .mp-table td { padding: .2rem .55rem; }
  .mp-table tbody tr + tr td { border-top: 1px solid var(--line-soft); }
  .mp-type { color: var(--muted); text-align: center; width: 1.4em; }
  .mp-type.sq { color: var(--brass); }
  .mp-pair { color: var(--ink); letter-spacing: .04em; text-align: center; }
  .mp-table thead th.col-pair { text-align: center; }
  .mp-orb { color: var(--muted); font-variant-numeric: tabular-nums; }
  .mp-empty { color: var(--muted); }
  svg { width: 100%; height: 100%; display: block; overflow: visible; }
  svg.dragging, svg.dragging * { cursor: grabbing; }
  text { font-family: system-ui, sans-serif; }

  /* Movable pointer + the midpoint chords it selects. Only the pointer is a drag handle. */
  .pointer-axis { stroke: var(--brass); stroke-width: 1.4; opacity: .7; cursor: grab; }
  .pointer-knob { fill: var(--brass); cursor: grab; }
  .pointer-grab { cursor: grab; }
  .chord { stroke: var(--brass); stroke-width: 1; fill: none; }   /* stroke-opacity set per chord by orb */

  .tick { stroke: var(--line); }   /* small, medium and major ticks share one colour; only length differs */
  .ring { fill: none; stroke: var(--line); }
  .ring.inner { stroke: var(--line-soft); }

  .skewer { stroke-width: .7; opacity: .55; }              /* neck: dot → glyph, in body colour */
  .pointer { stroke-width: 1.6; }                          /* colour tick on the outer scale */
  .dot { stroke: var(--bg); stroke-width: .5; }
  .hub-bg { fill: var(--bg); opacity: .82; }

  /* Inline SVG body glyphs (paths fill via currentColor → colour set inline per body). */
  .g { color: var(--ink); cursor: pointer; }
  /* Angle lettermarks (A / M) render as text. */
  .glyph { font-size: 18px; font-weight: 700; text-anchor: middle; dominant-baseline: central;
           fill: var(--ink); paint-order: stroke; stroke: var(--bg); stroke-width: 3px; cursor: pointer; }

  .hit { cursor: pointer; }
  .mc-mark { stroke: var(--muted); stroke-width: 2; }
  .mc-cap  { fill: var(--muted); font-size: 15px; font-weight: 700; text-anchor: middle; letter-spacing: .1em; }

  .hub-time { fill: var(--ink); font-family: ui-monospace, "SF Mono", "Cascadia Code", monospace;
              font-size: 34px; text-anchor: middle; font-variant-numeric: tabular-nums; letter-spacing: .02em; }
  .hub-sub  { fill: var(--muted); font-size: 10px; text-anchor: middle; letter-spacing: .08em; }
  .hub-tag  { fill: var(--brass); font-size: 8.5px; text-anchor: middle; letter-spacing: .2em; text-transform: uppercase; }

  .foot { display: flex; gap: 1.2rem; align-items: center; flex-wrap: wrap; justify-content: center;
          font-size: .78rem; color: var(--muted); }
  .foot .loc { color: var(--ink); font-variant-numeric: tabular-nums; }
  button.locate {
    font: inherit; font-size: .76rem; color: var(--ink); background: var(--panel);
    border: 1px solid var(--line); border-radius: 999px; padding: .3em .8em; cursor: pointer;
  }
  button.locate:hover { border-color: var(--brass); }
  button.locate:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
  .qh { display: inline-flex; align-items: center; gap: .28em; cursor: pointer; user-select: none;
        text-transform: none; letter-spacing: 0; font-variant-numeric: tabular-nums; }
  .qh input { width: .9em; height: .9em; margin: 0; accent-color: var(--brass); cursor: pointer; }
</style>

<div class="eyebrow">Meridian Clock <span>by Falcon Ephemeris</span></div>

<div class="stage">
  <div class="dial-wrap">
    <svg id="dial" viewBox="0 0 440 440" role="img" aria-label="90-degree harmonic dial for the current time and place"></svg>
  </div>
  <aside class="mp-panel">
    <div class="mp-apex" id="mp-apex"></div>
    <div class="mp-scroll">
      <table class="mp-table">
        <thead><tr>
          <th class="col-type"><label class="qh"><input type="checkbox" id="quadrant" checked>22.5</label></th>
          <th class="col-pair">Midpoint</th><th class="col-orb">Orb</th>
        </tr></thead>
        <tbody id="mp-list"></tbody>
      </table>
    </div>
  </aside>
</div>

<div class="foot">
  <span class="loc" id="loc">locating…</span>
  <button class="locate" id="locateBtn" type="button">◎ use my location</button>
</div>

<script src="../dist/ephemeris.bundle.js"></script>

<script>
(function () {
  const A = window.AstroEphem;
  const svg = document.getElementById("dial");
  const GLYPHS = JSON.parse(document.getElementById("glyph-data").textContent);
  const NS = "http://www.w3.org/2000/svg";
  const CX = 220, CY = 220;
  const R_TICK = 196, R_RING = 150, R_GLYPH = 172, R_DOT = 150, GAP = 12, GS = 23;

  // Bodies on the dial: luminaries + planets + node + the eight Uranian TNPs. Angles (A / M) are
  // added when a place is known. The Aries Point is the fixed marker at top (0° = the cardinal axis).
  const BODIES = ["sun","moon","mercury","venus","mars","jupiter","saturn","uranus","neptune","pluto",
                  "northNode","ariesPoint","cupido","hades","zeus","kronos","apollon","admetos","vulkanus","poseidon"];
  const ANGLES = { ascendant: "A", midheaven: "M", vertex: "V" };

  // Per-body hues [h, s, l] (traditional astrology colours, after harmonic-explorer's palette). The
  // eight Uranian TNPs share a violet. Lightness is lifted in dark mode so every hue reads on both.
  const HUE = {
    sun: [45, 90, 48], moon: [222, 62, 55], mercury: [96, 45, 42], venus: [172, 60, 40],
    mars: [0, 72, 52], jupiter: [258, 55, 60], saturn: [220, 12, 52], uranus: [244, 52, 62],
    neptune: [28, 78, 45], pluto: [186, 88, 34], chiron: [30, 52, 46], northNode: [220, 10, 52],
    ariesPoint: [42, 68, 50],
    ascendant: [222, 12, 50], midheaven: [222, 12, 50], vertex: [222, 12, 50],   // A / M / V share one gray
  };
  const TNP = new Set(["cupido","hades","zeus","kronos","apollon","admetos","vulkanus","poseidon"]);
  const isDark = () => {
    const t = document.documentElement.dataset.theme;
    return t === "dark" || (!t && matchMedia("(prefers-color-scheme: dark)").matches);
  };
  const colorFor = key => {
    const [h, s, l] = HUE[key] || (TNP.has(key) ? [284, 42, 60] : [0, 0, 40]);
    return `hsl(${h}, ${s}%, ${Math.min(l + (isDark() ? 12 : 0), 72)}%)`;
  };

  const pt = (r, deg) => { const a = deg * Math.PI / 180; return [CX + r * Math.sin(a), CY - r * Math.cos(a)]; };
  const el = (tag, attrs, text) => {
    const n = document.createElementNS(NS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    if (text != null) n.textContent = text;
    return n;
  };
  // An inline SVG glyph centered at (x, y), sized to `size`, filled with `color`. A nested <svg> with
  // the glyph's own viewBox keeps each glyph's aspect ratio (preserveAspectRatio defaults to meet).
  const glyphAt = (key, x, y, color, title, size = GS) => {
    const g = GLYPHS[key];
    const wrap = el("svg", { x: x - size / 2, y: y - size / 2, width: size, height: size, viewBox: g.vb, class: "g", "data-key": key, style: `color:${color}`, overflow: "visible" });
    if (title) wrap.appendChild(el("title", {}, title));
    wrap.appendChild(el("path", { fill: "currentColor", d: g.d }));
    return wrap;
  };
  const mod90 = x => ((x % 90) + 90) % 90;

  // Display names + a radix (true zodiac) readout for hover tooltips.
  const NAME = {
    sun: "Sun", moon: "Moon", mercury: "Mercury", venus: "Venus", mars: "Mars", jupiter: "Jupiter",
    saturn: "Saturn", uranus: "Uranus", neptune: "Neptune", pluto: "Pluto", chiron: "Chiron",
    northNode: "North Node", ariesPoint: "Aries Point", ascendant: "Ascendant", midheaven: "Midheaven", vertex: "Vertex",
    cupido: "Cupido", hades: "Hades", zeus: "Zeus", kronos: "Kronos", apollon: "Apollon",
    admetos: "Admetos", vulkanus: "Vulkanus", poseidon: "Poseidon",
  };
  const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
  const tip = p => {
    const d = Math.floor(p.degreesInSign), m = Math.round((p.degreesInSign - d) * 60);
    const mm = m === 60 ? [d + 1, 0] : [d, m];
    return `${NAME[p.key] || p.key} — ${mm[0]}°${String(mm[1]).padStart(2, "0")}′ ${cap(p.sign)}`;
  };

  // Two-letter tags + a canonical order for the midpoints list.
  const ABBR = {
    sun: "SU", moon: "MO", mercury: "ME", venus: "VE", mars: "MA", jupiter: "JU", saturn: "SA",
    uranus: "UR", neptune: "NE", pluto: "PL", chiron: "CH", northNode: "NN", ariesPoint: "AR",
    ascendant: "AC", midheaven: "MC", vertex: "VX",
    cupido: "CU", hades: "HA", zeus: "ZE", kronos: "KR", apollon: "AP", admetos: "AD", vulkanus: "VU", poseidon: "PO",
  };
  const ORDER = ["sun", "moon", "mercury", "venus", "mars", "jupiter", "saturn", "uranus", "neptune", "pluto",
    "chiron", "northNode", "cupido", "hades", "zeus", "kronos", "apollon", "admetos", "vulkanus", "poseidon",
    "ascendant", "midheaven", "vertex", "ariesPoint"];
  const oi = k => { const i = ORDER.indexOf(k); return i < 0 ? 99 : i; };
  const orderPair = (a, b) => (oi(a) <= oi(b) ? `${ABBR[a]}/${ABBR[b]}` : `${ABBR[b]}/${ABBR[a]}`);
  const fmtOrb = o => { let d = Math.floor(o), m = Math.round((o - d) * 60); if (m === 60) { d++; m = 0; } return `${d}°${String(m).padStart(2, "0")}′`; };

  const norm = a => ((a % 360) + 360) % 360;
  const angDist = (a, b) => { const d = Math.abs(norm(a) - norm(b)); return Math.min(d, 360 - d); };
  const angleFromCenter = (sx, sy) => norm(Math.atan2(sx - CX, -(sy - CY)) * 180 / Math.PI);
  // Angular footprint (deg) of a glyph at the glyph ring, from its rendered width + a little padding.
  const glyphWidth = key => {
    const g = GLYPHS[key];
    const w = g ? GS * Math.min(1, (p => p[2] / p[3])(g.vb.split(/\s+/).map(Number))) : GS * 0.62;
    return w / R_GLYPH * (180 / Math.PI) + 1.6;
  };

  let place = null, lastItems = [], overlayG = null, pointerAngle = 0, pointerUserSet = false, mcLon = 0, quadrant = true;
  let apexInfo = { kind: "free", lon: 0 };   // the axis under the pointer: body | midpoint | free
  // Screen angle of an ecliptic longitude on the MC-topped dial: fold to 90°, measure from the MC.
  const screenOf = lon => mod90(lon - mcLon) / 90 * 360;

  function drawFrame() {
    const f = document.createDocumentFragment();
    f.appendChild(el("circle", { class: "ring", cx: CX, cy: CY, r: R_TICK }));
    f.appendChild(el("circle", { class: "ring inner", cx: CX, cy: CY, r: R_RING }));

    for (let d = 0; d < 90; d++) {
      const deg = d / 90 * 360;
      const cls = d % 30 === 0 ? "tick maj" : d % 5 === 0 ? "tick med" : "tick";
      const len = d % 30 === 0 ? 15 : d % 5 === 0 ? 9 : 5;
      const [x1, y1] = pt(R_TICK, deg), [x2, y2] = pt(R_TICK - len, deg);
      f.appendChild(el("line", { class: cls, x1, y1, x2, y2 }));
    }
    // Midheaven marker outside the wheel at the top — the dial is oriented to the MC. Clickable
    // (data-key) so tapping it snaps the pointer back to the M axis.
    const [ix, iy] = pt(R_TICK, 0), [ox, oy] = pt(R_TICK + 10, 0);
    f.appendChild(el("line", { class: "mc-mark", "data-key": "midheaven", x1: ix, y1: iy, x2: ox, y2: oy }));
    f.appendChild(el("text", { class: "mc-cap", "data-key": "midheaven", x: CX, y: oy - 9 }, "M"));
    f.appendChild(el("circle", { class: "hit", "data-key": "midheaven", cx: CX, cy: oy - 5, r: 13, fill: "transparent", "pointer-events": "all" }));
    return f;
  }

  function render() {
    if (!place) return;
    const now = new Date();
    A.chart({ when: now, place, bodies: BODIES, aspects: false }).then(chart => {
      mcLon = chart.angles ? chart.angles.midheaven.longitude : 0;   // the MC sits at the top of the dial
      const items = [];
      for (const k of BODIES) {
        const b = chart.bodies[k];
        if (b) items.push({ key: k, p: { ...b, key: k }, angle: screenOf(b.longitude) });
      }
      if (chart.angles) for (const k in ANGLES) {
        const g = chart.angles[k];
        items.push({ key: k, p: { ...g, key: k }, angle: screenOf(g.longitude) });
      }
      // Width-aware declutter: each glyph claims room proportional to its actual rendered width. The
      // Midheaven isn't drawn in the wheel (it's the fixed top marker), so it doesn't claim a slot.
      const spaced = A.spaceAngles(items.filter(it => it.key !== "midheaven")
        .map(it => ({ key: it.key, angle: it.angle, width: glyphWidth(it.key) })), GAP);
      lastItems = items.map(it => ({ key: it.key, angle: it.angle, lon: it.p.longitude }));

      svg.replaceChildren(drawFrame());
      overlayG = el("g", { class: "overlay" });   // midpoint chords + pointer (behind the glyphs)
      svg.appendChild(overlayG);

      // Per body: a colour tick on the scale (true degree), a neck to the glyph, a dot, then the glyph.
      const bodiesG = el("g");
      for (const it of items) {
        if (it.key === "midheaven") continue;   // drawn as the fixed top marker, not in the wheel
        const color = colorFor(it.key);
        const [tx1, ty1] = pt(R_TICK, it.angle), [tx2, ty2] = pt(R_TICK - 9, it.angle);
        const [dx, dy] = pt(R_DOT, it.angle);
        const [gx, gy] = pt(R_GLYPH, spaced[it.key]);
        const [nx, ny] = pt(R_GLYPH - 9, spaced[it.key]);
        bodiesG.appendChild(el("line", { class: "pointer", x1: tx1, y1: ty1, x2: tx2, y2: ty2, stroke: color }));
        bodiesG.appendChild(el("line", { class: "skewer", x1: dx, y1: dy, x2: nx, y2: ny, stroke: color }));
        // The degree dot is clickable, and an invisible disc makes the (hollow) glyph easy to hit.
        bodiesG.appendChild(el("circle", { class: "dot hit", "data-key": it.key, cx: dx, cy: dy, r: 3, fill: color }));
        bodiesG.appendChild(el("circle", { class: "hit", "data-key": it.key, cx: gx, cy: gy, r: 13, fill: "transparent", "pointer-events": "all" }));
        const title = tip(it.p);
        if (ANGLES[it.key]) {
          const t = el("text", { class: "glyph", "data-key": it.key, x: gx, y: gy, style: `fill:${color}` });
          t.appendChild(el("title", {}, title));
          t.appendChild(document.createTextNode(ANGLES[it.key]));
          bodiesG.appendChild(t);
        } else {
          bodiesG.appendChild(glyphAt(it.key, gx, gy, color, title));
        }
      }
      svg.appendChild(bodiesG);

      // Hub: a soft disc so the clock reads clean over the pointer, then the readout.
      const hubG = el("g");
      hubG.appendChild(el("circle", { class: "hub-bg", cx: CX, cy: CY, r: 46 }));
      const hh = String(now.getHours()).padStart(2, "0"), mm = String(now.getMinutes()).padStart(2, "0");
      const dateStr = now.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
      hubG.appendChild(el("text", { class: "hub-tag", x: CX, y: CY - 34 }, "90° dial"));
      const timeT = el("text", { class: "hub-time", x: CX, y: CY });
      timeT.appendChild(el("tspan", {}, hh));
      timeT.appendChild(el("tspan", { id: "colon" }, ":"));
      timeT.appendChild(el("tspan", {}, mm));
      hubG.appendChild(timeT);
      hubG.appendChild(el("text", { class: "hub-sub", x: CX, y: CY + 26 }, dateStr));
      svg.appendChild(hubG);

      // The pointer defaults to the Midheaven's dial degree until the user drags it.
      if (!pointerUserSet) { const mc = items.find(it => it.key === "midheaven"); if (mc) pointerAngle = mc.angle; }
      drawOverlay();
    }).catch(err => console.error(err));
  }

  // Draw the movable pointer and the midpoint chords it selects. A midpoint picture "pointer = a/b"
  // means the pair's midpoint sits on the pointer axis on the dial, i.e. the two bodies are symmetric
  // about the pointer — so we connect them with a chord. Cheap enough to redraw live while dragging.
  function drawOverlay() {
    if (!overlayG) return;
    overlayG.replaceChildren();
    const ORB_PAIR = 2.0, ORB_SINGLE = 3.0;   // wider orb for direct single-body aspects
    const QUAD = ["☌", "⊞", "☍", "⊟"];        // conj / +square (waxing) / opp / −square (waning)
    // The apex body under the pointer gives real longitudes, so we can name each picture's quadrant
    // (conj/opp/±square) from the phase apex→midpoint. A free-dragged axis falls back to the folded dial.
    // The axis under the pointer: a body, else a midpoint whose degree the pointer hits, else a free
    // degree. Sets both the apex longitude (for typing) and the tree header (`apexInfo`).
    // The closest point to the pointer (not merely the first) — so a planet conjunct the MC doesn't
    // shadow the MC when the pointer sits exactly on it.
    let bodyApex = null, bd = Infinity;
    for (const it of lastItems) { const d = angDist(it.angle, pointerAngle); if (d < bd) { bd = d; bodyApex = it; } }
    if (bd >= 1.4) bodyApex = null;
    let apexLon;
    if (bodyApex) {
      apexLon = bodyApex.lon; apexInfo = { kind: "body", key: bodyApex.key };
    } else {
      let best = null;
      for (let i = 0; i < lastItems.length; i++) for (let j = i + 1; j < lastItems.length; j++) {
        const mid = A.midpoint(lastItems[i].lon, lastItems[j].lon);
        const dev = angDist(screenOf(mid), pointerAngle);
        if (!best || dev < best.dev) best = { a: lastItems[i].key, b: lastItems[j].key, lon: mid, dev };
      }
      if (best && best.dev < 1.4) { apexLon = best.lon; apexInfo = { kind: "midpoint", a: best.a, b: best.b, lon: best.lon }; }
      else { apexLon = norm(mcLon + pointerAngle / 4); apexInfo = { kind: "free", lon: apexLon }; }
    }
    // Is `targetLon` (a body or a midpoint) within `lim`° of the pointer? Returns orb + quadrant type.
    const classify = (targetLon, lim) => {
      const phase = norm(apexLon - targetLon);
      const qi = ((Math.round(phase / 90) % 4) + 4) % 4;   // 0/1/2/3 → ☌ ⊞ ☍ ⊟
      const dev = angDist(phase, qi * 90);
      if (dev > lim || (!quadrant && qi !== 0)) return null;  // quadrant off ⇒ conjunctions only
      return { orb: dev, type: QUAD[qi] };
    };
    const skipSingle = it => apexInfo.kind === "body" && it.key === apexInfo.key;
    const skipPair = (x, y) => apexInfo.kind === "body" ? (x === apexInfo.key || y === apexInfo.key)
      : apexInfo.kind === "midpoint" ? ((x === apexInfo.a && y === apexInfo.b) || (x === apexInfo.b && y === apexInfo.a)) : false;
    const active = [];
    // Single bodies conjunct / opposite / square the apex (not the apex itself) — a wider orb.
    for (const it of lastItems) {
      if (skipSingle(it)) continue;
      const r = classify(it.lon, ORB_SINGLE);
      if (r) active.push({ single: it.key, orb: r.orb, type: r.type });
    }
    // Midpoint pictures apex = a/b, chorded on the dial (the apex pair itself is skipped).
    for (let i = 0; i < lastItems.length; i++) {
      for (let j = i + 1; j < lastItems.length; j++) {
        const a = lastItems[i], b = lastItems[j];
        if (skipPair(a.key, b.key)) continue;
        const r = classify(A.midpoint(a.lon, b.lon), ORB_PAIR);
        if (!r) continue;
        const alpha = (0.75 - 0.6 * (r.orb / ORB_PAIR)).toFixed(3);
        const [ax, ay] = pt(R_DOT, a.angle), [bx, by] = pt(R_DOT, b.angle);
        overlayG.appendChild(el("line", { class: "chord", x1: ax, y1: ay, x2: bx, y2: by, "stroke-opacity": alpha }));
        active.push({ a: a.key, b: b.key, orb: r.orb, type: r.type });
      }
    }
    const arms = quadrant ? [0, 90, 180, 270] : [0];   // the pointer is a cross in quadrant mode
    // Pointer arms (one, or a cross in quadrant mode) from the hub edge all the way to the tick ring.
    for (const off of arms) {
      const ang = norm(pointerAngle + off);
      const [rx, ry] = pt(48, ang), [ex, ey] = pt(R_TICK, ang);
      overlayG.appendChild(el("line", { class: "pointer-axis", x1: rx, y1: ry, x2: ex, y2: ey }));
    }
    // The draggable inward triangle (and its invisible grab target) caps the primary arm.
    const [tipx, tipy] = pt(R_TICK - 3, pointerAngle);
    const b1 = pt(R_TICK + 13, pointerAngle - 2.4), b2 = pt(R_TICK + 13, pointerAngle + 2.4);
    overlayG.appendChild(el("path", { class: "pointer-knob", "data-drag": "1", d: `M ${tipx} ${tipy} L ${b1[0]} ${b1[1]} L ${b2[0]} ${b2[1]} Z` }));
    const [gx, gy] = pt(R_TICK + 4, pointerAngle);
    overlayG.appendChild(el("circle", { class: "pointer-grab", "data-drag": "1", cx: gx, cy: gy, r: 16, fill: "transparent", "pointer-events": "all" }));

    renderApex();
    renderMidpointList(active);
  }

  // The axis body (the pointer's target) at the head of the tree — its glyph + radix sign/degree.
  function renderApex() {
    const box = document.getElementById("mp-apex");
    if (!box) return;
    box.replaceChildren();
    const glyphEl = key => {
      const color = colorFor(key);
      if (GLYPHS[key]) {
        const g = GLYPHS[key];
        const s = el("svg", { viewBox: g.vb, style: `color:${color}` });
        s.appendChild(el("path", { fill: "currentColor", d: g.d }));
        return s;
      }
      const t = document.createElement("span");
      t.style.color = color; t.style.fontWeight = 700; t.textContent = ABBR[key] || key;
      return t;
    };
    const degEl = lon => {
      const s = A.signOf(lon), d = Math.floor(s.degreesInSign), m = Math.round((s.degreesInSign - d) * 60);
      const mm = m === 60 ? [d + 1, 0] : [d, m];
      const e = document.createElement("span");
      e.className = "mp-apex-deg";
      e.textContent = `${mm[0]}${s.symbol}${String(mm[1]).padStart(2, "0")}`;
      return e;
    };
    if (apexInfo.kind === "body") {
      const it = lastItems.find(x => x.key === apexInfo.key);
      box.className = "mp-apex";
      box.append(glyphEl(apexInfo.key), degEl(it ? it.lon : apexInfo.lon));
    } else if (apexInfo.kind === "midpoint") {
      const sep = document.createElement("span");
      sep.className = "mp-apex-sep"; sep.textContent = "/";
      box.className = "mp-apex";
      box.append(glyphEl(apexInfo.a), sep, glyphEl(apexInfo.b), degEl(apexInfo.lon));
    } else {
      box.className = "mp-apex free";
      box.append(document.createTextNode("axis "), degEl(apexInfo.lon));
    }
  }

  // The active midpoint pictures under the pointer, tightest orb first, in the side column.
  function renderMidpointList(active) {
    const list = document.getElementById("mp-list");
    if (!list) return;
    list.replaceChildren();
    if (!active.length) {
      const tr = document.createElement("tr");
      const td = document.createElement("td");
      td.className = "mp-empty"; td.colSpan = 3; td.textContent = "— none on the pointer —";
      tr.appendChild(td); list.appendChild(tr);
      return;
    }
    active.sort((x, y) => x.orb - y.orb);
    for (const m of active) {
      const tr = document.createElement("tr");
      const type = document.createElement("td");
      type.className = "mp-type" + (m.type === "⊞" || m.type === "⊟" ? " sq" : "");
      type.textContent = m.type;
      const pair = document.createElement("td");
      pair.className = "mp-pair"; pair.textContent = m.single ? (ABBR[m.single] || m.single) : orderPair(m.a, m.b);
      const orb = document.createElement("td");
      orb.className = "mp-orb"; orb.textContent = fmtOrb(m.orb);
      tr.append(type, pair, orb);
      list.appendChild(tr);
    }
  }

  // Drag anywhere on the dial to swing the pointer; double-click snaps it back to the Midheaven.
  function pointerFromEvent(e) {
    const rect = svg.getBoundingClientRect();
    const src = e.touches && e.touches[0] ? e.touches[0] : e;
    return angleFromCenter((src.clientX - rect.left) / rect.width * 440, (src.clientY - rect.top) / rect.height * 440);
  }
  let dragging = false;
  const onDown = e => {
    if (!e.target.closest) return;
    // Clicking a glyph snaps the pointer to that body's true dial degree.
    const g = e.target.closest("[data-key]");
    const it = g && lastItems.find(x => x.key === g.getAttribute("data-key"));
    if (it) { pointerUserSet = true; pointerAngle = it.angle; drawOverlay(); e.preventDefault(); return; }
    // Otherwise only the pointer itself is draggable — the rest of the dial is inert.
    if (!e.target.closest("[data-drag]")) return;
    dragging = true; svg.classList.add("dragging"); pointerUserSet = true; pointerAngle = pointerFromEvent(e); drawOverlay(); e.preventDefault();
  };
  const onMove = e => { if (!dragging) return; pointerAngle = pointerFromEvent(e); drawOverlay(); e.preventDefault(); };
  const onUp = () => { dragging = false; svg.classList.remove("dragging"); };
  svg.addEventListener("mousedown", onDown);
  window.addEventListener("mousemove", onMove);
  window.addEventListener("mouseup", onUp);
  svg.addEventListener("touchstart", onDown, { passive: false });
  window.addEventListener("touchmove", onMove, { passive: false });
  window.addEventListener("touchend", onUp);
  svg.addEventListener("dblclick", () => {
    pointerUserSet = false;
    const mc = lastItems.find(it => it.key === "midheaven");
    if (mc) pointerAngle = mc.angle;
    drawOverlay();
  });

  let placeLabel = "";
  function setPlace(lat, lon, label) {
    place = { lat, lon };
    placeLabel = label || `${lat.toFixed(3)}°, ${lon.toFixed(3)}°`;
    document.getElementById("loc").textContent = placeLabel;
    render();
  }

  // Remember the last resolved location (sandboxed iframes can block storage, so guard every access).
  const LS_KEY = "falcon-dial-place";
  const loadCached = () => {
    try {
      const o = JSON.parse(localStorage.getItem(LS_KEY));
      if (o && Number.isFinite(o.lat) && Number.isFinite(o.lon)) return o;
    } catch (e) {}
    return null;
  };
  const saveCached = (lat, lon) => { try { localStorage.setItem(LS_KEY, JSON.stringify({ lat, lon })); } catch (e) {} };

  // Update aligned to the minute, like a wall clock.
  function scheduleMinute() {
    const now = new Date();
    const ms = 60000 - (now.getSeconds() * 1000 + now.getMilliseconds());
    setTimeout(function tick() { render(); setTimeout(tick, 60000); }, ms);
  }

  function locate() {
    const loc = document.getElementById("loc");
    if (!navigator.geolocation) { if (!place) setPlace(0, 0, "Null Island (0°, 0°)"); return; }
    loc.textContent = "locating…";
    navigator.geolocation.getCurrentPosition(
      p => { setPlace(p.coords.latitude, p.coords.longitude); saveCached(p.coords.latitude, p.coords.longitude); },
      err => {
        const why = err.code === 1 ? "permission denied" : err.code === 2 ? "position unavailable" : "timed out";
        if (!place) setPlace(0, 0, "Null Island (0°, 0°)");
        loc.textContent = `${placeLabel} · location ${why}`;
      },
      { enableHighAccuracy: false, timeout: 8000, maximumAge: 300000 }
    );
  }

  document.getElementById("locateBtn").addEventListener("click", locate);
  document.getElementById("quadrant").addEventListener("change", e => { quadrant = e.target.checked; drawOverlay(); });
  // Blink the clock colon once a second — toggle fill-opacity, which animates reliably on SVG tspans
  // (including Safari, where a CSS opacity animation on a <tspan> does not).
  setInterval(() => {
    const c = document.getElementById("colon");
    if (c) c.setAttribute("fill-opacity", c.getAttribute("fill-opacity") === "0.5" ? "1" : "0.5");
  }, 1000);
  // Prefer a remembered location on load; otherwise try geolocation (falling back to Null Island).
  const cached = loadCached();
  if (cached) setPlace(cached.lat, cached.lon);
  else locate();
  scheduleMinute();
})();
</script>
<!-- END ARTIFACT BODY -->
</body>
</html>
